[package]
name = "upwell-benchmarks"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[lib]
# Shared benchmark support: the allocation-tracking allocator, the custom Criterion
# allocation measurement, and the DI graph builders every bench reuses.
path = "src/lib.rs"

[dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
upwell-core = { path = "../crates/core" }
upwell-di = { path = "../crates/di" }
upwell-app = { path = "../crates/app", default-features = false }
upwell-config = { path = "../crates/config" }
upwell-transport = { path = "../crates/transport" }
upwell-rpc = { path = "../crates/rpc" }
upwell-axum = { path = "../crates/axum", features = ["ws", "client"] }
upwell-axum-stomp = { path = "../crates/axum-stomp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net"] }
tokio-util = "0.7"
futures = "0.3"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# The framework comparison: the Upwell facade for macro-built apps, and summer-rs. summer-web's
# default `http2` feature is off so every framework serves the same axum build.
upwell = { path = "..", default-features = false, features = ["axum"] }
summer = "0.7"
summer-web = { version = "0.7", default-features = false }

[[bench]]
name = "di_hot_paths"
harness = false

[[bench]]
name = "di_graph_memory"
harness = false

[[bench]]
name = "config_resolution"
harness = false

[[bench]]
name = "serde_abstraction"
harness = false

[[bench]]
name = "rpc_dispatch"
harness = false

[[bench]]
name = "ws_pubsub_fanout"
harness = false

[[bench]]
name = "di_graph_preparation"
harness = false

[[bench]]
name = "reload_transition"
harness = false

[[bench]]
name = "reload_allocations"
harness = false

[[bench]]
name = "http_request"
harness = false

[[bench]]
name = "scoped_call"
harness = false

[[bench]]
name = "http_raw"
harness = false

[[bench]]
name = "http_summer"
harness = false

[[bench]]
name = "http_upwell"
harness = false
