[package]
name = "upwell-test-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
doctest = false

[features]
default = ["app"]
app = ["dep:upwell-app", "dep:upwell-config", "dep:upwell-dirs"]

[dependencies]
command-group = { workspace = true }
upwell-app = { workspace = true, optional = true }
upwell-config = { workspace = true, optional = true }
upwell-dirs = { workspace = true, optional = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[[test]]
name = "process"
path = "tests/process.rs"

[[test]]
name = "temp"
path = "tests/temp.rs"
