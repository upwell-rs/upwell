[package]
name = "upwell-rpc"
description = "The Upwell native RPC protocol: router, extractors, middleware, transports, and the serve loop over the protocol-agnostic upwell-app core."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
client = ["dep:async-trait", "dep:upwell-client", "upwell-rpc-macros/client"]
di-check = [
    "upwell-app/di-check",
    "upwell-di/di-check",
    "upwell-config/di-check",
    "upwell-transport/di-check",
    "upwell-rpc-macros/di-check",
]
hybrid-registry = ["upwell-rpc-macros/hybrid-registry"]
yaml = ["upwell-app/yaml", "upwell-config/yaml"]
watch = ["upwell-app/watch", "upwell-config/watch"]
tracing-subscriber = ["upwell-app/tracing-subscriber"]
tooling = ["upwell-app/tooling"]
# Set by the `upwell` facade: root the macros' generated protocol types at
# `::upwell::daemon::*`. Off (the default) keeps them at this standalone crate
# (`::upwell_rpc::*`), so depending on `upwell-rpc` directly works.
facade = ["upwell-rpc-macros/facade"]

[dependencies]
upwell-app = { workspace = true }
upwell-rpc-macros = { workspace = true }
upwell-client = { workspace = true, optional = true }
upwell-core = { workspace = true }
upwell-di = { workspace = true }
upwell-hooks = { workspace = true }
upwell-config = { workspace = true }
upwell-transport = { workspace = true, features = ["di"] }
upwell-dirs = { workspace = true }
arc-swap = { workspace = true }
linkme = { workspace = true }
inventory = { workspace = true }
# build.rs sets the `upwell_hybrid` cfg (below).
directories = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
upwell-build = { workspace = true }
