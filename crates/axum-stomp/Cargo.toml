[package]
name = "upwell-axum-stomp"
description = "STOMP 1.2 WebSocket messaging protocol for upwell-axum."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
client = ["upwell-axum/client", "dep:upwell-client"]
tungstenite = ["client", "upwell-axum/tungstenite", "dep:tokio-tungstenite-wasm"]
di-check = ["upwell-axum/di-check"]

[dependencies]
upwell-axum = { workspace = true, features = ["ws"] }
upwell-client = { workspace = true, optional = true }
upwell-transport = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
stomp-parser = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio-tungstenite-wasm = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
