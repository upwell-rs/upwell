[package]
name = "upwell-app"
description = "The Upwell protocol-agnostic application core: application and protocol states, plugins, DI runtime, scope planning, lifecycle, and builtins."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["cli"]
cli = ["dep:clap", "upwell-macros/cli"]
tooling = [
    "dep:upwell-tooling-schema",
    "dep:serde_json",
    "upwell-macros/tooling",
]
di-check = [
    "upwell-di/di-check",
    "upwell-config/di-check",
]
yaml = ["upwell-config/yaml"]
watch = ["upwell-config/watch"]
tracing-subscriber = ["dep:tracing-subscriber"]

[dependencies]
arc-swap = { workspace = true }
upwell-core = { workspace = true }
upwell-di = { workspace = true }
upwell-hooks = { workspace = true }
upwell-config = { workspace = true }
upwell-dirs = { workspace = true }
upwell-macros = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
thiserror = { workspace = true }
clap = { workspace = true, optional = true }
upwell-tooling-schema = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
