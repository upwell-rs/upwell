[package]
name = "upwell-macros"
description = "Procedural macros for the Upwell application framework."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

[features]
default = ["cli"]
cli = ["upwell-macros-core/cli"]
tooling = ["upwell-macros-core/tooling"]
# Emit compile-time dependency-injection checks: `impl Provided<Self> for Wiring`
# per component, plus a `Wiring: Provided<Dep>` bound per concrete dependency.
di-check = ["upwell-macros-core/di-check"]
# Force the `inventory` registration backend at codegen time (Apple/Mach-O hosts select it
# automatically). Forwarded to the shared codegen crate.
hybrid-registry = ["upwell-macros-core/hybrid-registry"]

[dependencies]
upwell-macros-core = { workspace = true }
proc-macro2 = { workspace = true }
