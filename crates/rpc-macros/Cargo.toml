[package]
name = "upwell-rpc-macros"
description = "Typed RPC protocol macros for the Upwell application framework."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
proc-macro = true

[features]
# Emit the generated RPC client (the `cfg!(feature = "client")` gates in #[service]/#[handlers]).
client = ["upwell-macros-core/client"]
# Emit the compile-time dependency-injection assertions (forwarded to macros-core, where the
# `di::enabled()` / field-injection assertions read the feature).
di-check = ["upwell-macros-core/di-check"]
# Force the `inventory` registration backend at codegen time. Forwarded to the shared codegen crate.
hybrid-registry = ["upwell-macros-core/hybrid-registry"]
# Root generated protocol types at the `upwell` facade (`::upwell::daemon::*`) instead of
# this protocol crate (`::upwell_rpc::*`). Enabled by the `upwell` facade; off means the
# standalone `upwell-rpc` is the root. Core vocabulary is always `::upwell` either way.
facade = []

[dependencies]
upwell-macros-core = { workspace = true }
proc-macro2 = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }
