[package]
name = "upwell-jobs"
description = "The Upwell job scheduler: declare `#[job]` methods that run on an interval or cron schedule as supervised background tasks, integrated as a plugin over the protocol-agnostic upwell-app core."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
cli = ["upwell-app/cli"]
di-check = [
    "upwell-app/di-check",
    "upwell-di/di-check",
    "upwell-jobs-macros/di-check",
]
# Root the macros' generated plugin types at `::upwell::jobs::*` (set by the `upwell`
# facade). Off (the default) keeps them at this standalone crate (`::upwell_jobs::*`), so
# depending on `upwell-jobs` directly works.
facade = ["upwell-jobs-macros/facade"]
# Provide the jobs-aware `init_tracing`, which composes the per-run `JobLogLayer` onto the
# framework subscriber. Pulls in the app's `init_tracing` helper (and its `tracing-subscriber`).
tracing-subscriber = ["upwell-app/tracing-subscriber"]

[dependencies]
upwell-app = { workspace = true }
upwell-core = { workspace = true }
upwell-di = { workspace = true }
upwell-hooks = { workspace = true }
upwell-jobs-macros = { workspace = true }
linkme = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
# Per-run log capture is a normal `tracing_subscriber::Layer`, so it composes with the
# application's existing subscriber. Registry + Layer traits only; no openssl/rsa.
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
# Swappable log-sink slot (`set_log_sink` is observed by every running job loop). Lock-free
# `Arc` swap; dependency-free, no openssl/rsa.
arc-swap = { workspace = true }
# `#[async_trait]` for the object-safe `JobLogSink` trait (async methods on a `dyn` trait).
async-trait = { workspace = true }
# Cron expression parser (5/6-field + `@hourly`/`@daily`/… nicknames, handled natively). Pure
# Rust; its only dependency is `chrono` — no `openssl`/`rsa`, keeping the banned-crate rule.
croner = "3"
# `every = ".."` interval parsing (`30s`, `5m`, `1h 30m`, `500ms`). Dependency-free, so no
# openssl/rsa; the ecosystem-standard human-duration parser rather than a bespoke one.
humantime = "2"
# Wall-clock `now()` for computing a cron job's next fire time (interval jobs use the
# monotonic tokio timer instead). `chrono` pulls no `openssl`/`rsa`.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
# Inspect the invocation contexts job runs execute in.
upwell-di = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
