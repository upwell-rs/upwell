[package]
name = "upwell-di"
description = "The Upwell dependency-injection engine: scope containers, factories, and component descriptors over the core resolver."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Emit compile-time DI checks (`Wiring: Provided<Dep>` bounds).
di-check = []
# Serialize the transition-planning vocabulary (actions, reasons, demand identities) for
# redacted transition reports, tooling, and telemetry.
serde = ["dep:serde"]

[dependencies]
upwell-core = { workspace = true }
upwell-hooks = { workspace = true }
arc-swap = { workspace = true }
linkme = { workspace = true }
inventory = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

# Sets the `upwell_hybrid` cfg (target-correct here) so the registration read-side can branch on
# the active backend if it ever needs to.
[build-dependencies]
upwell-build = { workspace = true }
