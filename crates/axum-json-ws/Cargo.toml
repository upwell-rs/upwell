[package]
name = "upwell-axum-json-ws"
description = "JSON request/reply WebSocket protocol for upwell-axum."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
client = ["upwell-axum/client", "dep:upwell-client"]
tungstenite = ["client", "upwell-axum/tungstenite"]

[dependencies]
upwell-axum = { workspace = true, features = ["ws"] }
upwell-client = { workspace = true, optional = true }
upwell-transport = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tracing = { workspace = true }
tokio = { workspace = true }
