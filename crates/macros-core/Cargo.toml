[package]
name = "upwell-macros-core"
description = "Shared codegen library for the Upwell proc-macros: attribute parsing, component/hook/method models, descriptor-slice emission, client generation, and crate-path resolution. Reused by upwell-macros and per-plugin macro crates."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["cli"]
cli = []
tooling = []
# Emit the generated client (the `cfg!(feature = "client")` gate in client codegen).
# Forwarded from the macro crates' `client` feature.
client = []
# Emit the compile-time dependency-injection assertions (read by `di::enabled()` and the
# field-injection codegen). Forwarded from the macro crates' `di-check` feature.
di-check = []
# Force the `inventory` registration backend at codegen time (read by `backend::use_inventory()`).
# Complements the build-script `upwell_hybrid` cfg (auto-on for Apple/Mach-O hosts); this is the
# convenient feature-based force, forwarded from each macro crate and the facade.
hybrid-registry = []

[dependencies]
syn = { workspace = true, features = ["visit-mut"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
proc-macro2 = { workspace = true, features = ["span-locations"] }

[build-dependencies]
upwell-build = { workspace = true }
